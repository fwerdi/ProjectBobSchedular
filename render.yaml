# Optional Render blueprint for Hermes (Bob backend).
# Only needed if you later host the backend in the cloud instead of your laptop.
# Creates a free web service + a free PostgreSQL database.
services:
  - type: web
    name: hermes
    runtime: node
    plan: free
    rootDir: hermes
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TIMEZONE
        value: Asia/Jakarta
      # Database connection string, injected from the Postgres instance below.
      - key: DATABASE_URL
        fromDatabase:
          name: hermes-db
          property: connectionString
      # ---- Secrets: set these manually in the Render dashboard ----
      - key: API_KEY
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      # Google service-account JSON, pasted as one value (see README).
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: hermes-db
    plan: free
