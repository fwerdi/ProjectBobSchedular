# Render blueprint for Hermes (Bob backend).
# Creates a free web service + a free PostgreSQL database.
# After connecting the repo, fill the secret env vars in the Render dashboard.
services:
  - type: web
    name: hermes
    runtime: node
    plan: free
    rootDir: hermes
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TELEGRAM_MODE
        value: webhook
      - key: TIMEZONE
        value: Asia/Jakarta
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      # PUBLIC_URL is set to this service's own URL by Render.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: hermes
          property: host
      # Database connection string, injected from the Postgres instance below.
      - key: DATABASE_URL
        fromDatabase:
          name: hermes-db
          property: connectionString
      # ---- Secrets: set these manually in the Render dashboard ----
      - key: API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      # Google service-account JSON, pasted as one line (see README).
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: hermes-db
    plan: free
