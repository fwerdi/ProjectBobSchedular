    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    padding:32px 16px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:24px;border-bottom:2px solid var(--line);padding-bottom:16px;
    flex-wrap:wrap;gap:12px;
  }
  h1{
    font-family:'Space Mono','Courier New',ui-monospace,monospace;font-weight:700;font-size:26px;
    letter-spacing:1px;
  }
  h1 span{color:var(--amber);}
  .clock{font-family:'Space Mono','Courier New',ui-monospace,monospace;color:var(--dim);font-size:13px;text-align:right;}
  .clock .time{font-size:20px;color:var(--text);}

  .quote-bar{
    text-align:center;padding:14px 20px;margin-bottom:24px;
    min-height:44px;display:flex;flex-direction:column;justify-content:center;
    opacity:0;transform:translateY(6px);
    transition:opacity 1.6s cubic-bezier(.4,0,.2,1), transform 1.6s cubic-bezier(.4,0,.2,1);
  }
  .quote-bar.visible{opacity:1;transform:translateY(0);}
  .quote-text{font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:14px;color:var(--text);letter-spacing:.3px;}
  .quote-source{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:11px;color:var(--dim);margin-top:6px;letter-spacing:.5px;}

  .stats-row{display:flex;gap:12px;margin-bottom:24px;}
  .stat-card{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;display:flex;align-items:center;gap:14px;
  }
  .stat-num{font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:22px;font-weight:700;color:var(--text);}
  .stat-label{font-size:11px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase;}
  .progress-track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;}
  .progress-fill{height:100%;background:var(--amber);border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);}

  .mascot-wrap{
    display:flex;align-items:center;justify-content:center;
    width:56px;height:56px;flex-shrink:0;position:relative;
  }
  .mascot-glow{
    position:absolute;inset:-6px;border-radius:50%;
    background:radial-gradient(circle, var(--amber) 0%, transparent 70%);
    opacity:0;transition:opacity .8s ease;
  }
  .mascot-svg{position:relative;z-index:1;transition:filter .8s ease;transform-origin:50% 60%;}
  @keyframes bob-soft{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-1.5px);}
  }
  @keyframes bob-strong{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-3px) scale(1.03);}
  }
  @keyframes glow-pulse{
    0%,100%{opacity:var(--glow-min);}
    50%{opacity:var(--glow-max);}
  }
  .mascot-svg.idle-soft{animation:bob-soft 3.2s ease-in-out infinite;}
  .mascot-svg.idle-strong{animation:bob-strong 2.2s ease-in-out infinite;}
  .mascot-glow.pulse{animation:glow-pulse 2.4s ease-in-out infinite;}
  .sparkle{position:absolute;font-size:10px;opacity:0;color:var(--amber);}

  .add-panel{
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:16px;margin-bottom:28px;
  }
  .add-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;position:relative;}
  input[type=text]{
    flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);padding:10px 12px;border-radius:4px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:14px;
  }
  input[type=text]:focus{outline:none;border-color:var(--amber);}
  .deadline-btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    padding:9px 12px;border-radius:4px;font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:13px;
    cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
  }
  .deadline-btn.set{color:var(--amber);border-color:var(--amber);}
  .deadline-btn .clear-x{margin-left:2px;opacity:.7;}
  .deadline-btn .clear-x:hover{opacity:1;color:var(--danger);}
  .picker{
    position:absolute;top:calc(100% + 6px);left:0;z-index:20;
    background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:14px;width:260px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;
  }
  .picker.open{display:block;}
  .picker-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .picker-nav button{background:none;border:none;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 8px;}
  .picker-nav button:hover{color:var(--amber);}
  .picker-month{font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:13px;color:var(--text);}
  .picker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:12px;}
  .picker-dow{font-size:10px;color:var(--dim);text-align:center;padding:4px 0;font-family:'Space Mono','Courier New',ui-monospace,monospace;}
  .picker-day{
    font-size:12px;text-align:center;padding:6px 0;border-radius:4px;cursor:pointer;
    color:var(--text);font-family:'Space Mono','Courier New',ui-monospace,monospace;
  }
  .picker-day:hover{background:var(--line);}
  .picker-day.muted{color:var(--gray);opacity:.4;}
  .picker-day.selected{background:var(--amber);color:#241a06;font-weight:700;}
  .picker-day.today{border:1px solid var(--amber);}
  .picker-time{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .picker-time label{font-size:11px;color:var(--dim);font-family:'Space Mono','Courier New',ui-monospace,monospace;}
  .picker-time select{flex:1;padding:7px 6px;font-size:13px;}
  .picker-actions{display:flex;justify-content:flex-end;gap:8px;}
  .picker-actions button{
    font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:12px;padding:7px 14px;border-radius:4px;
    border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;
  }
  .picker-actions .confirm{background:var(--amber);color:#241a06;border-color:var(--amber);font-weight:700;}
  select{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:4px;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;
  }
  .tier-btns{display:flex;gap:6px;}
  .tier-btn{
    padding:9px 14px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);
    color:var(--dim);font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:12px;letter-spacing:.5px;
    cursor:pointer;
  }
  .tier-btn.active[data-tier="primary"]{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
  .tier-btn.active[data-tier="secondary"]{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);}
  .tier-btn.active[data-tier="temporary"]{background:var(--gray-dim);border-color:var(--gray);color:#c3c6cc;}
  .add-row2{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .btn-add{
    background:var(--amber);color:#241a06;border:none;padding:10px 20px;
    border-radius:4px;font-family:'Space Mono','Courier New',ui-monospace,monospace;font-weight:700;font-size:13px;
    cursor:pointer;letter-spacing:.5px;
  }
  .btn-add:hover{opacity:.9;}

  .section-label{
    font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:12px;letter-spacing:2px;color:var(--dim);
    margin:24px 0 10px;display:flex;align-items:center;gap:10px;
  }
  .section-label::after{content:'';flex:1;height:1px;background:var(--line);}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .dot.primary{background:var(--amber);}
  .dot.secondary{background:var(--teal);}
  .dot.temporary{background:var(--gray);}

  .board{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);}
  .row{
    display:flex;align-items:center;gap:14px;padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row.primary{border-left:3px solid var(--amber);}
  .row.secondary{border-left:3px solid var(--teal);}
  .row.temporary{border-left:3px solid var(--gray);border-left-style:dashed;}
  .row.done{opacity:.4;}
  .row.done .task-title{text-decoration:line-through;}

  .checkbox{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--line);
    flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .checkbox.checked{background:var(--amber);border-color:var(--amber);}
  .checkbox.checked::after{content:'✓';font-size:12px;color:#241a06;font-weight:700;}

  .row-main{flex:1;min-width:0;}
  .task-title{font-size:15px;font-weight:500;word-break:break-word;}
  .task-meta{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:11px;color:var(--dim);}
  .meta-badge{display:flex;align-items:center;gap:4px;}
  .meta-badge.overdue{color:var(--danger);}

  .del-btn{
    background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;
    padding:4px 8px;flex-shrink:0;
  }
  .del-btn:hover{color:var(--danger);}

  .empty{padding:40px 16px;text-align:center;color:var(--dim);font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:13px;}

  .header-right{display:flex;align-items:center;gap:12px;}
  .conn-status{
    font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:11px;letter-spacing:.5px;
    color:var(--danger);white-space:nowrap;
  }
  .conn-status.online{color:var(--teal);}
  .gear-btn{
    background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:16px;line-height:1;
  }
  .gear-btn:hover{color:var(--fg);border-color:var(--dim);}

  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;
    width:100%;max-width:420px;
  }
  .modal-title{
    font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:13px;letter-spacing:2px;
    color:var(--amber);margin-bottom:8px;
  }
  .modal-desc{font-size:12.5px;color:var(--dim);line-height:1.5;margin:0 0 16px;}
  .modal-label{
    display:block;font-family:'Space Mono','Courier New',ui-monospace,monospace;font-size:11px;
    letter-spacing:.5px;color:var(--dim);margin:12px 0 5px;
  }
  .modal input{width:100%;box-sizing:border-box;}
  .modal-actions{display:flex;gap:8px;margin-top:18px;}
  .modal-btn{
    flex:1;background:var(--amber);color:#241a06;border:none;padding:10px;border-radius:5px;
    font-family:'Space Mono','Courier New',ui-monospace,monospace;font-weight:700;font-size:12px;cursor:pointer;
  }
  .modal-btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line);}
  .modal-btn:hover{opacity:.9;}
  .modal-result{font-size:12px;margin-top:12px;min-height:16px;font-family:'Space Mono','Courier New',ui-monospace,monospace;}
  .modal-result.ok{color:var(--teal);}
  .modal-result.err{color:var(--danger);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TASK<span>BOARD</span></h1>
    <div class="header-right">
      <span class="conn-status" id="connStatus" title="status koneksi ke otak Bob">● offline</span>
      <button class="gear-btn" id="gearBtn" title="Setting koneksi">⚙</button>
      <div class="clock"><div id="today"></div><div class="time" id="now"></div></div>
    </div>
  </header>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-title">KONEKSI KE OTAK BOB</div>
      <p class="modal-desc">Tempel alamat tunnel yang muncul di jendela "Start Bob" di laptop. Kalau laptop lagi mati, biarkan kosong.</p>
      <label class="modal-label">Alamat backend (tunnel)</label>
      <input type="text" id="baseInput" placeholder="https://xxxx.trycloudflare.com">
      <label class="modal-label">API key</label>
      <input type="text" id="keyInput" placeholder="sama dengan API_KEY di .env">
      <div class="modal-actions">
        <button id="testBtn" class="modal-btn ghost">Tes koneksi</button>
        <button id="saveBtn" class="modal-btn">Simpan</button>
      </div>
      <div class="modal-result" id="modalResult"></div>
    </div>
  </div>

  <div class="quote-bar" id="quoteBar">
    <div class="quote-text" id="quoteText"></div>
    <div class="quote-source" id="quoteSource"></div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="mascot-wrap">
        <div class="mascot-glow" id="mascotGlow"></div>
        <svg class="mascot-svg" id="mascotSvg" width="48" height="48" viewBox="0 0 48 48">
          <ellipse cx="24" cy="44" rx="14" ry="3" fill="#000" opacity="0.15"></ellipse>
          <path d="M24 6 C13 6 7 15 7 25 C7 35 14 41 24 41 C34 41 41 35 41 25 C41 15 35 6 24 6 Z" fill="#e9e7e0" stroke="#3a3d44" stroke-width="1.5"></path>
          <path d="M24 6 C30 6 35 10 37 16 C33 12 28 10 24 10 C20 10 15 12 11 16 C13 10 18 6 24 6 Z" fill="#c9c6bd"></path>
          <circle cx="17" cy="24" r="2.6" fill="#232529"></circle>
          <circle cx="31" cy="24" r="2.6" fill="#232529"></circle>
          <path d="M20 32 Q24 35 28 32" stroke="#3a3d44" stroke-width="1.5" fill="none" stroke-linecap="round"></path>
          <path d="M15 15 A3 3 0 1 0 15 15.1 Z" fill="#f0a83c" id="mascotMoon"></path>
        </svg>
      </div>
      <div style="flex:1;">
        <div class="stat-num" id="streakNum">0</div>
        <div class="stat-label" id="streakLabel">day streak</div>
      </div>
    </div>
    <div class="stat-card">
      <div style="flex:1;">
        <div class="stat-num" id="todayNum">0/0</div>
        <div class="stat-label">done today</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
      </div>
    </div>
  </div>

  <div class="add-panel">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Write a new task...">
      <button type="button" class="deadline-btn" id="deadlineBtn">📅 Set deadline</button>
      <div class="picker" id="picker">
        <div class="picker-nav">
          <button type="button" id="prevMonth">‹</button>
          <span class="picker-month" id="pickerMonth"></span>
          <button type="button" id="nextMonth">›</button>
        </div>
        <div class="picker-grid" id="pickerGrid"></div>
        <div class="picker-time">
          <label>TIME</label>
          <select id="hourSelect"></select>
          <span style="color:var(--dim)">:</span>
          <select id="minuteSelect"></select>
        </div>
        <div class="picker-actions">
          <button type="button" id="pickerClear">Clear</button>
          <button type="button" class="confirm" id="pickerConfirm">Set</button>
        </div>
      </div>
    </div>
    <div class="add-row2">
      <div class="tier-btns" id="tierBtns">
        <button class="tier-btn active" data-tier="primary" style="background:var(--amber-dim);border-color:var(--amber);color:var(--amber);">PRIMARY</button>
        <button class="tier-btn" data-tier="secondary">SECONDARY</button>
        <button class="tier-btn" data-tier="temporary">TEMPORARY</button>
      </div>
      <button class="btn-add" id="addBtn">+ ADD</button>
    </div>
  </div>

  <div id="lists"></div>
</div>

<script>
const quotes = [
  {text:"The secret of getting ahead is getting started.", source:"Mark Twain"},
  {text:"It always seems impossible until it's done.", source:"Nelson Mandela"},
  {text:"Do or do not. There is no try.", source:"Yoda, Star Wars"},
  {text:"Well done is better than well said.", source:"Benjamin Franklin"},
  {text:"You miss 100% of the shots you don't take.", source:"Wayne Gretzky"},
  {text:"I'm gonna make him an offer he can't refuse.", source:"The Godfather"},
  {text:"The way to get started is to quit talking and begin doing.", source:"Walt Disney"},
  {text:"With great power comes great responsibility.", source:"Spider-Man"},
  {text:"Success is not final, failure is not fatal.", source:"Winston Churchill"},
  {text:"Why do we fall? So we can learn to pick ourselves up.", source:"Batman Begins"},
  {text:"The future belongs to those who believe in the beauty of their dreams.", source:"Eleanor Roosevelt"},
  {text:"Just keep swimming.", source:"Finding Nemo"},
  {text:"Discipline equals freedom.", source:"Jocko Willink"},
  {text:"Not all those who wander are lost.", source:"J.R.R. Tolkien"},
  {text:"Life is 10% what happens to us and 90% how we react to it.", source:"Charles Swindoll"},
  {text:"Hakuna Matata, it means no worries.", source:"The Lion King"},
  {text:"A person who never made a mistake never tried anything new.", source:"Albert Einstein"},
  {text:"Great things never came from comfort zones.", source:"Unknown"},
];
let quoteIdx = -1;
function showQuote(){
  const bar = document.getElementById('quoteBar');
  bar.classList.remove('visible');
  setTimeout(()=>{
    let next = Math.floor(Math.random()*quotes.length);
    if(next === quoteIdx) next = (next+1) % quotes.length;
    quoteIdx = next;
    document.getElementById('quoteText').textContent = '"'+quotes[quoteIdx].text+'"';
    document.getElementById('quoteSource').textContent = '— '+quotes[quoteIdx].source;
    bar.classList.add('visible');
  }, 800);
}
showQuote();
setInterval(showQuote, 9000);

let tasks = [];
let selectedTier = 'primary';
let pendingDeadline = null;
let viewMonth = new Date().getMonth();
let viewYear = new Date().getFullYear();
let pickDay = null;
const tierOrder = {primary:0, secondary:1, temporary:2};
const tierLabel = {primary:'Primary', secondary:'Secondary', temporary:'Temporary'};

const hourSel = document.getElementById('hourSelect');
const minuteSel = document.getElementById('minuteSelect');
for(let h=0;h<24;h++){ hourSel.innerHTML += `<option value="${h}">${pad(h)}</option>`; }
for(let m=0;m<60;m+=5){ minuteSel.innerHTML += `<option value="${m}">${pad(m)}</option>`; }

function renderPicker(){
  const monthNames=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('pickerMonth').textContent = monthNames[viewMonth]+' '+viewYear;
  const grid = document.getElementById('pickerGrid');
  grid.innerHTML='';
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{
    grid.innerHTML += `<div class="picker-dow">${d}</div>`;
  });
  const first = new Date(viewYear, viewMonth, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const today = new Date();
  for(let i=0;i<startOffset;i++){ grid.innerHTML += `<div></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const isToday = d===today.getDate() && viewMonth===today.getMonth() && viewYear===today.getFullYear();
    const isSelected = pickDay===d;
    const cell = document.createElement('div');
    cell.className = 'picker-day'+(isToday?' today':'')+(isSelected?' selected':'');
    cell.textContent = d;
    cell.addEventListener('click',()=>{ pickDay=d; renderPicker(); });
    grid.appendChild(cell);
  }
}
document.getElementById('prevMonth').addEventListener('click',()=>{
  viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} pickDay=null; renderPicker();
});
document.getElementById('nextMonth').addEventListener('click',()=>{
  viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} pickDay=null; renderPicker();
});
document.getElementById('deadlineBtn').addEventListener('click',(e)=>{
  e.stopPropagation();
  document.getElementById('picker').classList.toggle('open');
});
document.getElementById('picker').addEventListener('click',e=>e.stopPropagation());
document.addEventListener('click',()=>{ document.getElementById('picker').classList.remove('open'); });

document.getElementById('pickerClear').addEventListener('click',()=>{
  pendingDeadline = null; pickDay = null;
  document.getElementById('deadlineBtn').textContent = '📅 Set deadline';
  document.getElementById('deadlineBtn').classList.remove('set');
  document.getElementById('picker').classList.remove('open');
});
document.getElementById('pickerConfirm').addEventListener('click',()=>{
  if(pickDay===null){ pickDay = new Date().getDate(); }
  const h = parseInt(hourSel.value||0);
  const m = parseInt(minuteSel.value||0);
  const dt = new Date(viewYear, viewMonth, pickDay, h, m);
  pendingDeadline = dt.toISOString();
  document.getElementById('deadlineBtn').textContent = '📅 '+fmtDeadline(pendingDeadline);
  document.getElementById('deadlineBtn').classList.add('set');
  document.getElementById('picker').classList.remove('open');
});
renderPicker();

function pad(n){return n.toString().padStart(2,'0');}
function updateClock(){
  const d = new Date();
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  document.getElementById('today').textContent = days[d.getDay()]+', '+d.getDate()+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  document.getElementById('now').textContent = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
setInterval(updateClock,1000); updateClock();

document.querySelectorAll('.tier-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tier-btn').forEach(b=>{b.classList.remove('active');b.style.background='';b.style.borderColor='var(--line)';b.style.color='var(--dim)';});
    selectedTier = btn.dataset.tier;
    btn.classList.add('active');
    if(selectedTier==='primary'){btn.style.background='var(--amber-dim)';btn.style.borderColor='var(--amber)';btn.style.color='var(--amber)';}
    if(selectedTier==='secondary'){btn.style.background='var(--teal-dim)';btn.style.borderColor='var(--teal)';btn.style.color='var(--teal)';}
    if(selectedTier==='temporary'){btn.style.background='var(--gray-dim)';btn.style.borderColor='var(--gray)';btn.style.color='#c3c6cc';}
  });
});

function fmtDeadline(iso){
  const d = new Date(iso);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()]+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

// ===== Hermes backend wiring =====
// "base" = alamat backend (tunnel Cloudflare). Disimpan di browser, bisa diubah
// lewat tombol ⚙ di web. Kalau kosong, dianggap same-origin (dibuka via Hermes lokal).
const HERMES = {
  base: '',
  apiKey: 'bob-hermes-local-dev-key', // must match API_KEY in hermes/.env
};
try{
  const savedBase = localStorage.getItem('hermes_base');
  const savedKey = localStorage.getItem('hermes_key');
  if(savedBase !== null) HERMES.base = savedBase;
  if(savedKey !== null && savedKey !== '') HERMES.apiKey = savedKey;
}catch(e){}

let backendOnline = false;

function apiHeaders(){
  const h = { 'Content-Type': 'application/json' };
  if(HERMES.apiKey) h['x-api-key'] = HERMES.apiKey;
  return h;
}

async function apiGet(path){
  const res = await fetch(HERMES.base + path, { headers: apiHeaders() });
  if(!res.ok) throw new Error('GET '+path+' -> '+res.status);
  return res.json();
}
async function apiSend(method, path, body){
  const res = await fetch(HERMES.base + path, {
    method, headers: apiHeaders(),
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok) throw new Error(method+' '+path+' -> '+res.status);
  return res.json();
}

function setConnStatus(online){
  backendOnline = online;
  const el = document.getElementById('connStatus');
  if(!el) return;
  el.textContent = online ? '● online' : '● offline';
  el.classList.toggle('online', online);
}

// ===== Settings modal (alamat tunnel + api key) =====
function openSettings(){
  document.getElementById('baseInput').value = HERMES.base || '';
  document.getElementById('keyInput').value = HERMES.apiKey || '';
  document.getElementById('modalResult').textContent = '';
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){
  document.getElementById('settingsModal').classList.remove('open');
}
async function testConnection(base, key){
  const url = (base ? base.replace(/\/$/,'') : '') + '/api/health';
  const headers = key ? { 'x-api-key': key } : {};
  const res = await fetch(url, { headers });
  if(!res.ok) throw new Error('status '+res.status);
  return res.json();
}
document.getElementById('gearBtn').addEventListener('click', openSettings);
document.getElementById('settingsModal').addEventListener('click', e=>{
  if(e.target.id === 'settingsModal') closeSettings();
});
document.getElementById('testBtn').addEventListener('click', async ()=>{
  const r = document.getElementById('modalResult');
  const base = document.getElementById('baseInput').value.trim();
  const key = document.getElementById('keyInput').value.trim();
  r.className = 'modal-result'; r.textContent = 'Mengetes...';
  try{
    const h = await testConnection(base, key);
    r.className = 'modal-result ok';
    r.textContent = '✓ Tersambung. Calendar: ' + (h.calendar ? 'aktif' : 'nonaktif');
  }catch(e){
    r.className = 'modal-result err';
    r.textContent = '✗ Gagal nyambung. Pastikan laptop & tunnel nyala.';
  }
});
document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const base = document.getElementById('baseInput').value.trim().replace(/\/$/,'');
  const key = document.getElementById('keyInput').value.trim();
  HERMES.base = base;
  if(key) HERMES.apiKey = key;
  try{
    localStorage.setItem('hermes_base', base);
    localStorage.setItem('hermes_key', key);
  }catch(e){}
  closeSettings();
  loadTasks(); // reconnect with new settings
});

async function loadTasks(){
  await loadStreak();
  try{
    tasks = await apiGet('/api/tasks');
    setConnStatus(true);
    try{ localStorage.setItem('taskboard_tasks', JSON.stringify(tasks)); }catch(e){}
  }catch(e){
    // Offline / backend unreachable -> fall back to localStorage.
    setConnStatus(false);
    try{
      const raw = localStorage.getItem('taskboard_tasks');
      tasks = raw ? JSON.parse(raw) : [];
    }catch(_){ tasks = []; }
  }
  render();
}

// Always mirror to localStorage so the UI survives a backend outage.
async function saveTasks(){
  try{ localStorage.setItem('taskboard_tasks', JSON.stringify(tasks)); }catch(e){}
}

let streakData = {streak:0, lastActiveDate:null};
function todayStr(){ return new Date().toDateString(); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return d.toDateString(); }
async function loadStreak(){
  try{
    const raw = localStorage.getItem('taskboard_streak');
    if(raw) streakData = JSON.parse(raw);
  }catch(e){}
}
async function saveStreak(){
  try{ localStorage.setItem('taskboard_streak', JSON.stringify(streakData)); }catch(e){}
}
function registerCompletion(){
  const today = todayStr();
  if(streakData.lastActiveDate === today) return;
  if(streakData.lastActiveDate === yesterdayStr()) streakData.streak += 1;
  else streakData.streak = 1;
  streakData.lastActiveDate = today;
  saveStreak();
}

function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const notes = [660, 880];
    notes.forEach((freq, i)=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      o.connect(g); g.connect(ctx.destination);
      const start = ctx.currentTime + i*0.09;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(0.12, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start+0.28);
      o.start(start); o.stop(start+0.3);
    });
  }catch(e){}
}

function renderStats(){
  const today = todayStr();
  const doneToday = tasks.filter(t=>t.done && t.completedAt===today).length;
  const activeToday = tasks.filter(t=>!t.done).length + doneToday;
  document.getElementById('todayNum').textContent = doneToday+'/'+activeToday;
  document.getElementById('progressFill').style.width = (activeToday? Math.round(doneToday/activeToday*100):0)+'%';

  const streak = streakData.streak || 0;
  document.getElementById('streakNum').textContent = streak;
  document.getElementById('streakLabel').textContent = streak===1 ? 'day streak' : 'day streak';

  const glow = document.getElementById('mascotGlow');
  const svg = document.getElementById('mascotSvg');
  const moon = document.getElementById('mascotMoon');
  svg.classList.remove('idle-soft','idle-strong');
  glow.classList.remove('pulse');
  if(streak <= 0){
    glow.style.opacity = 0; svg.style.filter = 'grayscale(0.6) brightness(0.85)'; moon.setAttribute('fill','#8b909c');
  } else if(streak < 3){
    glow.style.opacity = 0.15; svg.style.filter = 'grayscale(0.1)'; moon.setAttribute('fill','#f0a83c');
    svg.classList.add('idle-soft');
  } else if(streak < 7){
    glow.style.opacity = 0.35; svg.style.filter = 'none'; moon.setAttribute('fill','#f0a83c');
    svg.classList.add('idle-soft');
    glow.style.setProperty('--glow-min','0.25'); glow.style.setProperty('--glow-max','0.4'); glow.classList.add('pulse');
  } else if(streak < 14){
    glow.style.opacity = 0.55; svg.style.filter = 'brightness(1.05)'; moon.setAttribute('fill','#ffce7a');
    svg.classList.add('idle-strong');
    glow.style.setProperty('--glow-min','0.4'); glow.style.setProperty('--glow-max','0.65'); glow.classList.add('pulse');
  } else {
    glow.style.opacity = 0.8; svg.style.filter = 'brightness(1.15)'; moon.setAttribute('fill','#ffce7a');
    svg.classList.add('idle-strong');
    glow.style.setProperty('--glow-min','0.6'); glow.style.setProperty('--glow-max','0.9'); glow.classList.add('pulse');
  }
}

function groupLabel(dateStr){
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  const d = new Date(dateStr); d.setHours(0,0,0,0);
  if(d.getTime() === today.getTime()) return 'Today';
  if(d.getTime() === tomorrow.getTime()) return 'Tomorrow';
  if(d.getTime() < today.getTime()) return 'Overdue';
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+months[d.getMonth()];
}

function render(){
  renderStats();
  const container = document.getElementById('lists');
  container.innerHTML = '';
  if(tasks.length===0){
    container.innerHTML = '<div class="empty">No tasks yet. Add your first one above.</div>';
    return;
  }
  const sorted = [...tasks].sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    if(a.deadline && b.deadline) return new Date(a.deadline)-new Date(b.deadline);
    if(a.deadline) return -1;
    if(b.deadline) return 1;
    return tierOrder[a.tier]-tierOrder[b.tier];
  });

  let currentGroup = null;
  sorted.forEach(t=>{
    const group = t.deadline ? groupLabel(t.deadline) : 'No date';
    if(group !== currentGroup){
      currentGroup = group;
      const label = document.createElement('div');
      label.className='section-label';
      const dotClass = group==='Overdue' ? 'temporary' : (group==='Today' ? 'primary' : (group==='No date' ? 'temporary' : 'secondary'));
      label.innerHTML = '<span class="dot '+dotClass+'"></span>'+group.toUpperCase();
      container.appendChild(label);
      const board = document.createElement('div');
      board.className='board';
      board.id = 'board-'+group.replace(/\s+/g,'-');
      container.appendChild(board);
    }
    const board = document.getElementById('board-'+group.replace(/\s+/g,'-'));
    const row = document.createElement('div');
    row.className = 'row '+t.tier+(t.done?' done':'');
    const now = new Date();
    const overdue = t.deadline && !t.done && new Date(t.deadline) < now;
    row.innerHTML = `
      <div class="checkbox ${t.done?'checked':''}" data-id="${t.id}"></div>
      <div class="row-main">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          ${t.deadline ? `<span class="meta-badge ${overdue?'overdue':''}">⏱ ${fmtDeadline(t.deadline)}${overdue?' (overdue)':''}</span>` : ''}
          <span class="meta-badge">${tierLabel[t.tier]}</span>
        </div>
      </div>
      <button class="del-btn" data-id="${t.id}">✕</button>
    `;
    board.appendChild(row);
  });

  container.querySelectorAll('.checkbox').forEach(cb=>{
    cb.addEventListener('click',async ()=>{
      const t = tasks.find(x=>x.id===cb.dataset.id);
      t.done = !t.done;
      if(t.done){
        t.completedAt = todayStr();
        registerCompletion();
        playChime();
      } else {
        t.completedAt = null;
      }
      saveTasks(); render();
      if(backendOnline){
        try{ await apiSend('PATCH','/api/tasks/'+t.id, { done: t.done }); }
        catch(e){ setConnStatus(false); }
      }
    });
  });
  container.querySelectorAll('.del-btn').forEach(b=>{
    b.addEventListener('click',async ()=>{
      const id = b.dataset.id;
      tasks = tasks.filter(x=>x.id!==id);
      saveTasks(); render();
      if(backendOnline){
        try{ await apiSend('DELETE','/api/tasks/'+id); }
        catch(e){ setConnStatus(false); }
      }
    });
  });
}

document.getElementById('addBtn').addEventListener('click',async ()=>{
  const input = document.getElementById('taskInput');
  if(!input.value.trim()) return;
  const payload = {
    title: input.value.trim(),
    tier: selectedTier,
    deadline: pendingDeadline,
  };
  input.value='';
  const keepDeadline = pendingDeadline;
  pendingDeadline = null; pickDay = null;
  document.getElementById('deadlineBtn').textContent = '📅 Set deadline';
  document.getElementById('deadlineBtn').classList.remove('set');

  if(backendOnline){
    try{
      const task = await apiSend('POST','/api/tasks', payload);
      tasks.unshift(task);
      saveTasks(); render();
      return;
    }catch(e){ setConnStatus(false); }
  }
  // Offline fallback.
  tasks.push({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title: payload.title,
    tier: payload.tier,
    deadline: keepDeadline,
    done: false
  });
  saveTasks(); render();
});
document.getElementById('taskInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('addBtn').click();
});

loadTasks();
